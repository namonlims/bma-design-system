<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Sarabun','Inter','Noto Sans Thai',system-ui,sans-serif;
  background:var(--page-bg);color:var(--page-fg);-webkit-font-smoothing:antialiased}
:root{--page-bg:#F7F9F9;--page-fg:#14312A;--panel:#FFFFFF;--line:#E3E9E8;--muted:#5C6B68;
  --accent:var(--brand-p700,#007549);--accent-soft:var(--brand-p100,#E2F3EB)}
body[data-mode="dark"]{--page-bg:#0C1512;--page-fg:#E8F1EE;--panel:#141F1B;--line:#243530;--muted:#93A6A1;
  --accent:var(--brand-p400,#6AD6A5);--accent-soft:#182A24}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:.75rem 1.25rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:.6rem;font-weight:700;letter-spacing:-.01em}
.dot{width:1.6rem;height:1.6rem;border-radius:.5rem;background:linear-gradient(135deg,var(--brand-p600,#08A768),var(--brand-p800,#004C31))}
.pill{font:600 .7rem/1 ui-monospace,monospace;padding:.35rem .55rem;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
nav.tabs{display:flex;gap:.25rem;margin-left:auto;flex-wrap:wrap}
nav.tabs a{padding:.4rem .7rem;border-radius:.5rem;text-decoration:none;color:var(--muted);font-size:.85rem;font-weight:600;transition:background .15s,color .15s}
nav.tabs a:hover{background:var(--surface-list-hover,#F4FBF8);color:var(--accent)}
nav.tabs a.on{background:var(--accent-soft);color:var(--accent)}
select,input,button.ghost{font:inherit;font-size:.85rem;padding:.4rem .6rem;border:1px solid var(--line);
  border-radius:.5rem;background:var(--panel);color:var(--page-fg)}
button.ghost{cursor:pointer}
main{max-width:1200px;margin:0 auto;padding:1.5rem 1.25rem 5rem}
.hero{padding:1.5rem 0 1rem}
.hero h1{margin:0 0 .35rem;font-size:1.9rem;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);max-width:70ch;line-height:1.6}
.stats{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:.75rem;padding:.6rem .9rem}
.stat b{display:block;font-size:1.25rem}
.stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
section h2{font-size:1.05rem;margin:2.25rem 0 .25rem;scroll-margin-top:5rem}
section .sub{color:var(--muted);font-size:.8rem;margin:0 0 .75rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.6rem}
.tok{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.6rem;cursor:pointer;
  display:flex;gap:.6rem;align-items:center;text-align:left;width:100%;color:inherit;font:inherit}
.tok:hover{border-color:var(--accent)}
.sw{width:2.4rem;height:2.4rem;border-radius:.5rem;border:1px solid var(--line);flex:none;overflow:hidden;
  background-image:linear-gradient(45deg,#0001 25%,transparent 25%,transparent 75%,#0001 75%),
  linear-gradient(45deg,#0001 25%,transparent 25%,transparent 75%,#0001 75%);background-size:10px 10px;background-position:0 0,5px 5px}
.sw i{display:block;width:100%;height:100%}
.tok .meta{min-width:0;flex:1}
.tok code{display:block;font-size:.72rem;font-family:ui-monospace,monospace;word-break:break-all;line-height:1.3}
.tok small{display:block;color:var(--muted);font-size:.68rem;margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok .resolved{font-family:ui-monospace,monospace;color:var(--page-fg);opacity:.75}
.chip{font:600 .72rem/1.25 ui-monospace,monospace;background:var(--accent-soft);color:var(--accent);
  padding:.5rem .55rem;border-radius:.45rem;flex:none;min-width:3.4rem;max-width:6.5rem;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%) translateY(2rem);opacity:0;
  background:var(--page-fg);color:var(--page-bg);padding:.55rem .9rem;border-radius:999px;font-size:.8rem;
  transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
footer{color:var(--muted);font-size:.75rem;text-align:center;padding:2rem 1rem}
.swatchrow{display:flex;gap:.35rem;flex-wrap:wrap;margin:.5rem 0 0}
.swatchrow div{flex:1 1 4rem;height:3rem;border-radius:.45rem;border:1px solid var(--line);position:relative}
.swatchrow div span{position:absolute;bottom:.15rem;left:.3rem;font:600 .6rem ui-monospace,monospace;color:#fff;mix-blend-mode:difference}

.ds-sel{position:relative;display:inline-block;min-width:150px;font-family:'Sarabun','Inter','Noto Sans Thai',system-ui,sans-serif}
.ds-sel-btn{display:flex;align-items:center;gap:var(--dim-space-150,6px);width:100%;height:var(--dim-size-700,36px);
  padding:0 var(--dim-space-300,12px);background:var(--surface-input-default,#FFFFFF);
  border:var(--dim-stroke-100,1px) solid var(--border-input-default,#E2E4E6);border-radius:var(--dim-radius-200,8px);
  font:inherit;font-size:var(--type-size-sm,14px);color:var(--text-input-filled,#4D5358);text-align:left;cursor:pointer;
  transition:border-color .15s,box-shadow .15s}
.ds-sel-btn:hover,.ds-sel.open .ds-sel-btn{border-color:var(--border-input-hover,#08A768);
  box-shadow:inset 0 0 0 1px var(--border-input-hover,#08A768),0 0 0 4px var(--primaryBorder-600,rgba(8,167,104,.15))}
.ds-sel-btn:focus-visible{outline:none;border-color:var(--border-input-typing,#08A768);
  box-shadow:inset 0 0 0 1px var(--border-input-typing,#08A768),0 0 0 4px var(--primaryBorder-600,rgba(8,167,104,.15))}
.ds-sel-btn .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-sel-btn .pre{color:var(--text-input-default,#ADB2B7)}
.ds-sel-btn .chev{flex:none;width:16px;height:16px;color:var(--icon-input-filled,#4D5358);transition:transform .15s}
.ds-sel.open .ds-sel-btn .chev{transform:rotate(180deg)}
.ds-sel-list{position:absolute;top:calc(100% + var(--dim-space-100,4px));left:0;min-width:100%;z-index:60;display:none;
  background:var(--surface-dropdown-default,#FFFFFF);border:var(--dim-stroke-100,1px) solid var(--border-dropdown-default,#EBEBEB);
  border-radius:var(--dim-radius-400,16px);padding:var(--dim-space-100,4px);
  box-shadow:var(--shadow-dropdown,0 4px 4px rgba(100,116,139,.1),0 16px 32px rgba(100,116,139,.15));
  max-height:min(360px,60vh);overflow:auto;box-sizing:border-box}
.ds-sel.open .ds-sel-list{display:block}
.ds-sel-grp{padding:var(--dim-space-150,6px) var(--dim-space-300,12px) var(--dim-space-050,2px);
  font-size:var(--type-size-xs,12px);color:var(--text-neutral-tertiary,#ADB2B7);white-space:nowrap}
.ds-sel-opt{display:flex;align-items:center;gap:var(--dim-space-200,8px);min-height:var(--dim-size-800,40px);
  padding:var(--dim-space-200,8px) var(--dim-space-300,12px);border-radius:var(--dim-radius-150,6px);
  color:var(--text-list-default,#4D5358);font-size:var(--type-size-sm,14px);cursor:pointer;white-space:nowrap;box-sizing:border-box}
.ds-sel-opt:hover,.ds-sel-opt.active{background:var(--surface-list-hover,#F4FBF8);color:var(--text-list-hover,#007549)}
.ds-sel-opt.selected{background:var(--surface-list-selected,#F4FBF8)}
.ds-sel-opt .chk{margin-left:auto;width:16px;height:16px;color:var(--icon-brand-check,#007549);visibility:hidden}
.ds-sel-opt.selected .chk{visibility:visible}

main.tight{padding-top:.75rem}
.hbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:0 0 .5rem}
.hbar input{flex:1;min-width:200px;font-size:.8rem}
.hbar select{font-size:.8rem}
.hbar .count{font:600 .68rem/1 ui-monospace,monospace;color:var(--muted)}
.hbar .title{font:700 .9rem/1 inherit;margin-right:.25rem}
.day{margin:.8rem 0 .3rem;font:700 .7rem/1 ui-monospace,monospace;color:var(--muted);letter-spacing:.04em}
.cm{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.4rem .7rem;margin-bottom:.3rem;display:grid;grid-template-columns:auto 1fr;gap:.1rem .7rem;align-items:baseline;font-size:.8rem}
.cm.hide{display:none}
.cm .sha{font:600 .66rem/1.6 ui-monospace,monospace}
.cm .sha a{text-decoration:none}
.cm .subj{font-weight:600;line-height:1.4}
.cm .meta{grid-column:2;font-size:.68rem;color:var(--muted);display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.cm .chips{grid-column:2;display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.1rem}
.chip{font:600 .62rem/1.4 ui-monospace,monospace;padding:.05rem .4rem;border-radius:999px;background:var(--accent-soft);color:var(--accent);text-decoration:none}
.chip.area{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.grp{background:transparent;border:1px solid var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);padding:2rem 0;text-align:center;font-size:.8rem}
</style>

const esc=(t)=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const list=document.getElementById('list'), q=document.getElementById('q'), count=document.getElementById('count'), empty=document.getElementById('empty'), typeSel=document.getElementById('type');
function render(){
  const v=q.value.trim().toLowerCase(), t=typeSel.value;let n=0,day='';const out=[];
  for(const c of H.commits){
    if(t.startsWith('a:')&&c.areas.indexOf(t.slice(2))===-1)continue;
    if(t.startsWith('g:')&&!c.slugs.some(s=>H.slugGroup[s]===t.slice(2)))continue;
    const names=c.slugs.map(s=>(H.slugName[s]||s)).join(' ');
    const groups=c.slugs.map(s=>H.slugGroup[s]||'').join(' ');
    const hay=(c.subject+' '+c.author+' '+c.slugs.join(' ')+' '+names+' '+groups+' '+c.areas.join(' ')+' '+c.short).toLowerCase();
    if(v&&!hay.includes(v))continue;n++;
    if(c.date!==day){day=c.date;out.push('<div class="day">'+day+'</div>')}
    out.push('<div class="cm"><span class="sha"><a href="https://github.com/namonlims/bma.health/commit/'+c.sha+'" target="_blank" rel="noopener">'+c.short+'</a></span>'
      +'<div class="subj">'+esc(c.subject)+'</div>'
      +'<div class="meta"><span>'+esc(c.author)+'</span><span>'+c.files+' ไฟล์</span></div>'
      +'<div class="chips">'+c.areas.map(a=>'<span class="chip area">'+a+'</span>').join('')
      +[...new Set(c.slugs.map(s=>H.slugGroup[s]).filter(Boolean))].map(g=>'<span class="chip grp">'+g+'</span>').join('')
      +c.slugs.map(s=>'<a class="chip" href="./reference.html#'+s+'">'+esc(H.slugName[s]||s)+'</a>').join('')+'</div></div>');
  }
  list.innerHTML=out.join('');count.textContent=(v?n+' / ':'')+H.commits.length+' commits';empty.hidden=n>0;
}
q.oninput=render;typeSel.onchange=render;
if(location.hash){q.value=decodeURIComponent(location.hash.slice(1))}
render();
