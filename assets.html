  /* ธีม = Namon Playground design system (namon-tokens.css · --nd-*) — ไม่ใช้ tokens.css ของ bma ในหน้านี้ */
  :root { --bg: var(--nd-surface-card, #FFFFFF); --fg: var(--nd-text-default, #363B3F); --muted: var(--nd-text-tertiary, #6A727A); --line: var(--nd-gray-200, #E2E4E6); --card: var(--nd-surface-card, #FFFFFF); --accent: var(--nd-text-brand, #3F5BFA); --accent-soft: var(--nd-surface-brand-quiet, #EEF1FF); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: var(--nd-type-family-body, 'Sarabun', system-ui, sans-serif); font-size: var(--nd-type-size-sm, 14px); }
  header.top { display:flex; flex-wrap:wrap; align-items:center; gap: var(--nd-space-300, 12px); padding: var(--nd-space-300, 12px) var(--nd-space-400, 16px); border-bottom: var(--nd-stroke-100, 1px) solid var(--line); background:var(--card); }
  header.top h1 { font-family: var(--nd-type-family-heading, 'Poppins', 'Sarabun', sans-serif); font-size: var(--nd-type-size-lg, 18px); font-weight: var(--nd-type-weight-bold, 700); margin:0; }
  nav.tabs { display:flex; gap:4px; margin-left:auto; flex-wrap:wrap; }
  nav.tabs a { min-height:44px; display:inline-flex; align-items:center; padding:0 12px; border-radius:8px; text-decoration:none; color:var(--muted); font-weight:600; }
  nav.tabs a:hover { background:var(--accent-soft); color:var(--accent); }
  nav.tabs a.on { background:var(--accent-soft); color:var(--accent); }
  .wrap { max-width:1280px; margin:0 auto; padding:16px; }
  .lead { color:var(--muted); margin:0 0 12px; }
  .bar { position:sticky; top:0; background:var(--bg); padding:8px 0 12px; z-index:2; }
  .search { width:100%; min-height: var(--nd-control-h, 44px); padding: 0 var(--nd-space-400, 16px); border:var(--nd-stroke-100, 1px) solid var(--nd-border-input, #8A9197); border-radius: var(--nd-radius-300, 10px); background: var(--nd-surface-input, #FFFFFF); color: var(--nd-text-input, #4D5358); font: inherit; font-size: var(--nd-type-size-sm, 14px); }
  .search::placeholder { color: var(--nd-text-placeholder, #8A9197); opacity: 1; }
  .search:hover { border-color: var(--nd-border-input-hover, #5470FB); }

  .chip-row { display:flex; align-items:center; gap: var(--nd-space-300, 12px); margin-top: var(--nd-space-300, 12px); }
  .chip-label { flex:0 0 64px; width:64px; text-align:left; color:var(--muted); font-size: var(--nd-type-size-xs, 12px); font-weight: var(--nd-type-weight-medium, 500); }
  .chip-row .chips { margin-top:0; }
  .chips { display:flex; flex-wrap:wrap; gap: var(--nd-space-200, 8px); margin-top: var(--nd-space-300, 12px); }
  @media (max-width: 767px) { .chip-row { flex-direction:column; align-items:flex-start; gap: var(--nd-space-100, 4px); } }
  .chip { display:inline-flex; align-items:center; gap: var(--nd-space-100, 4px); min-height: var(--nd-control-h, 44px); padding: 0 var(--nd-space-300, 12px); border:var(--nd-stroke-100, 1px) solid var(--nd-border-input, #8A9197); border-radius: var(--nd-radius-full, 9999px); background: var(--nd-surface-card, #FFFFFF); color: var(--nd-text-default, #363B3F); font: inherit; font-size: var(--nd-type-size-sm, 14px); cursor:pointer; }
  .chip:hover { border-color: var(--nd-border-input-hover, #5470FB); }

  .chip span { color: var(--nd-text-tertiary, #6A727A); }

  .summary { color:var(--muted); margin:8px 0 12px; }

  .card[hidden] { display:none; }
  .thumb { width:64px; height:64px; margin: 0 auto; flex:0 0 auto; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .thumb img { width:64px; height:64px; object-fit:contain; }
  .thumb .glyph { font-family:'Material Symbols Outlined'; font-size:40px; line-height:1; color:var(--fg); font-feature-settings:'liga'; user-select:none; }
  .thumb.lottie svg { width:64px; height:64px; }
  .meta { padding:10px 10px 0; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .name { line-height:1.6; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .thumb.dark { background: var(--nd-text-default, #363B3F); border-radius: var(--nd-radius-300, 10px); }
  .used { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .used.none { color: var(--nd-text-warning, #8A5A00); }
  .sub, .folder { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dl-row { display:flex; flex-wrap:wrap; gap: var(--nd-space-150, 6px); margin-top: var(--nd-space-150, 6px); }
  .dl-row .dl { flex:1 1 0; min-width:0; margin-top:0; padding: 0 var(--nd-space-200, 8px); }
  .dl { margin-top: var(--nd-space-150, 6px); min-height: var(--nd-control-h, 44px); border:var(--nd-stroke-100, 1px) solid var(--nd-border-info, #DCE2FF); border-radius: var(--nd-radius-200, 8px); background: var(--nd-surface-brand-quiet, #EEF1FF); color: var(--nd-text-brand, #3F5BFA); font: inherit; font-size: var(--nd-type-size-sm, 14px); font-weight: var(--nd-type-weight-medium, 500); cursor:pointer; }
  .dl:hover { background: var(--nd-blue-100, #DCE2FF); border-color: var(--nd-blue-400, #7B8FFC); }

  .empty { color:var(--muted); padding:32px 0; display:none; }
  .stamp { color:var(--muted); font-size:12px; margin-top:24px; }

  var KIND = { illustration: 'Illustration', lottie: 'Lottie', icon: 'Icon (SVG)', glyph: 'Icon (Material Symbols)' };
  var grid = document.getElementById('grid');
  var state = { repo: null, kind: null, q: '' };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  ITEMS.forEach(function (it) {
    var art = document.createElement('article');
    art.className = 'card';
    art.dataset.repo = ',' + it.repo + ','; art.dataset.kind = it.kind;
    art.dataset.q = (it.name + ' ' + it.folder).toLowerCase();
    var isG = it.kind === 'glyph';
    var thumb = isG ? '<div class="thumb"><span class="glyph" aria-hidden="true">' + esc(it.name) + '</span></div>' : it.kind === 'lottie'
      ? '<div class="thumb lottie' + (it.dark ? ' dark' : '') + '" data-src="' + esc(it.src) + '"></div>'
      : '<div class="thumb' + (it.kind === 'icon' ? ' icon' : '') + (it.dark ? ' dark' : '') + '"><img loading="lazy" alt="" src="' + esc(it.src) + '"></div>';
    art.innerHTML = thumb +
      '<div class="meta"><div class="name" title="' + esc(it.name) + '">' + esc(it.name) + '</div>' +
      '<div class="sub">' + esc(it.repo.replace(/,/g, ' · ')) + ' · ' + (isG ? 'ใช้ ' + it.uses + ' จุด' : esc(KIND[it.kind] || it.kind) + ' · ' + it.kb + ' KB') + '</div>' +
      '<div class="folder" title="' + esc(it.folder) + '">' + esc(it.folder) + '</div>' +
      (isG ? '<div class="used">โค้ดเรียกชื่อนี้โดยตรง</div>' : it.usedCount ? '<div class="used" title="' + esc(it.used.join('\n') + (it.usedCount > it.used.length ? '\n+' + (it.usedCount - it.used.length) + ' ไฟล์' : '')) + '">ใช้ใน ' + esc(it.used[0].split('/').pop()) + (it.usedCount > 1 ? ' +' + (it.usedCount - 1) : '') + '</div>' : '<div class="used none">ไม่พบการใช้ในโค้ด</div>') +
      '<div class="dl-row"><button class="dl" type="button" data-what="' + (isG ? 'copy' : 'file') + '">' + (isG ? 'copy ชื่อ' : 'download') + '</button></div></div>';
    art.dataset.index = String(ITEMS.indexOf(it));
    grid.appendChild(art);
  });
  var cards = Array.prototype.slice.call(grid.querySelectorAll('.card'));
  function apply() {
    var shown = 0;
    cards.forEach(function (c) {
      var ok = (!state.repo || c.dataset.repo.indexOf(',' + state.repo + ',') !== -1) && (!state.kind || c.dataset.kind === state.kind) && (!state.q || c.dataset.q.indexOf(state.q) !== -1);
      c.hidden = !ok; if (ok) shown++;
    });
    document.getElementById('shown').textContent = shown;
    document.getElementById('empty').style.display = shown ? 'none' : 'block';
    /* ตัวเลขบน chip = จำนวนที่จะเหลือถ้ากด chip นั้น (นับตามคำค้นหา + ตัวกรองของอีกกลุ่ม) */
    chips.forEach(function (b) {
      var g = b.dataset.g, v = b.dataset.v, other = g === 'repo' ? 'kind' : 'repo', n = 0;
      cards.forEach(function (c) {
        var inQ = !state.q || c.dataset.q.indexOf(state.q) !== -1;
        function hit(grp, val) { return grp === 'repo' ? c.dataset.repo.indexOf(',' + val + ',') !== -1 : c.dataset.kind === val; }
        if ((v === 'all' || hit(g, v)) && (!state[other] || hit(other, state[other])) && inQ) n++;
      });
      b.querySelector('span').textContent = n;
      b.setAttribute('aria-pressed', String(v === 'all' ? !state[g] : state[g] === v));
    });
  }
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
  chips.forEach(function (b) {
    b.addEventListener('click', function () {
      var g = b.dataset.g, v = b.dataset.v;
      state[g] = (v === 'all' || state[g] === v) ? null : v;
      apply();
    });
  });
  document.querySelector('.search').addEventListener('input', function (e) { state.q = e.target.value.trim().toLowerCase(); apply(); });
  apply(); /* ตั้งค่า chip ทั้งหมด = เปิดอยู่ตั้งแต่โหลด */
  grid.addEventListener('click', function (e) {
    var btn = e.target.closest('.dl'); if (!btn) return;
    var it = ITEMS[Number(btn.closest('.card').dataset.index)];
    if (it.kind === 'glyph') { if (navigator.clipboard) navigator.clipboard.writeText(it.name); btn.textContent = 'คัดลอกแล้ว'; setTimeout(function () { btn.textContent = 'copy ชื่อ'; }, 1200); return; }
    function save(blob, name) {
      var a = document.createElement('a');
