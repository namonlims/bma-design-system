  var KIND = { illustration: 'Illustration', lottie: 'Lottie', icon: 'Icon' };
  var grid = document.getElementById('grid');
  var state = { repo: null, kind: null, q: '' };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  ITEMS.forEach(function (it) {
    var art = document.createElement('article');
    art.className = 'card';
    art.dataset.repo = it.repo; art.dataset.kind = it.kind;
    art.dataset.q = (it.name + ' ' + it.folder).toLowerCase();
    var thumb = it.kind === 'lottie'
      ? '<div class="thumb lottie" data-src="' + esc(it.src) + '"></div>'
      : '<div class="thumb' + (it.kind === 'icon' ? ' icon' : '') + '"><img loading="lazy" alt="" src="' + esc(it.src) + '"></div>';
    art.innerHTML = thumb +
      '<div class="meta"><div class="name" title="' + esc(it.name) + '">' + esc(it.name) + '</div>' +
      '<div class="sub">' + esc(it.repo) + ' · ' + esc(KIND[it.kind] || it.kind) + ' · ' + it.kb + ' KB</div>' +
      '<div class="folder" title="' + esc(it.folder) + '">' + esc(it.folder) + '</div>' +
      '<div class="dl-row"><button class="dl" type="button" data-what="file">ไฟล์ต้นทาง</button><button class="dl" type="button" data-what="meta">ข้อมูล JSON</button></div></div>';
    art.dataset.index = String(ITEMS.indexOf(it));
    grid.appendChild(art);
  });
  var cards = Array.prototype.slice.call(grid.querySelectorAll('.card'));
  function apply() {
    var shown = 0;
    cards.forEach(function (c) {
      var ok = (!state.repo || c.dataset.repo === state.repo) && (!state.kind || c.dataset.kind === state.kind) && (!state.q || c.dataset.q.indexOf(state.q) !== -1);
      c.hidden = !ok; if (ok) shown++;
    });
    document.getElementById('shown').textContent = shown;
    document.getElementById('empty').style.display = shown ? 'none' : 'block';
  }
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
  chips.forEach(function (b) {
    b.addEventListener('click', function () {
      var g = b.dataset.g, v = b.dataset.v;
      state[g] = state[g] === v ? null : v;
      chips.forEach(function (x) { if (x.dataset.g === g) x.setAttribute('aria-pressed', String(state[g] === x.dataset.v)); });
      apply();
    });
  });
  document.querySelector('.search').addEventListener('input', function (e) { state.q = e.target.value.trim().toLowerCase(); apply(); });
  grid.addEventListener('click', function (e) {
    var btn = e.target.closest('.dl'); if (!btn) return;
    var it = ITEMS[Number(btn.closest('.card').dataset.index)];
    function save(blob, name) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }
    if (btn.dataset.what === 'meta') {
      /* ข้อมูล JSON = metadata ของ asset (ชื่อ · repo · ชนิด · โฟลเดอร์ · path · ขนาด) */
      var meta = { name: it.name, repo: it.repo, kind: it.kind, folder: it.folder, path: it.src, kb: it.kb };
      save(new Blob([JSON.stringify(meta, null, 2)], { type: 'application/json' }), it.name.replace(/\.[^.]+$/, '') + '.meta.json');
      return;
    }
    /* ไฟล์ต้นทาง (SVG หรือ Lottie JSON) ตามชื่อไฟล์เดิม */
    fetch(it.src).then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then(function (blob) { save(blob, it.name.split('/').pop()); })
      .catch(function () { window.open(it.src, '_blank'); });
  });
  var lotties = Array.prototype.slice.call(grid.querySelectorAll('.thumb.lottie'));
  function play(el) {
    if (!window.lottie || el.dataset.loaded) return;
    el.dataset.loaded = '1';
    window.lottie.loadAnimation({ container: el, renderer: 'svg', loop: true, autoplay: true, path: el.dataset.src });
  }
  function start() {
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting) { play(en.target); io.unobserve(en.target); } }); }, { rootMargin: '200px' });
      lotties.forEach(function (el) { io.observe(el); });
    } else { lotties.forEach(play); }
  }
  if (window.lottie) start(); else window.addEventListener('load', start);
})();
